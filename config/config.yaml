# 唯一的設定真實來源。祕密走環境變數(見 .env.example),這裡不放任何憑證。
#
# ⚠️ 這裡「沒有」也「絕不會有」104 帳號密碼欄位 — 見 SPEC.md 硬性規則 9。
# ⚠️ 標記【硬上限】的值在 config.py 啟動時強制驗證,設得更寬鬆會直接拒絕啟動。
#    只能往更保守的方向調。
version: 1

search:
  # 多組關鍵字,結果以 jobNo 合併去重。
  # 使用者背景橫跨 NLP/CV/RAG,單一「AI工程師」會漏掉名稱不同但內容相符的職缺。
  # 2026-09-22 D17 改版：從 AI 主敘事換成交付軌道（decisions.md D7／D14／D16）。
  # ⚠️ 順序有意義：預算用盡時 search.py 會停在當下的關鍵字，後面的整個不跑。
  #    所以最重要的排前面。
  # 拿掉的：AI工程師（D7 明列避開，實測 220 筆命中最多、卻是最打不贏的那格）、
  #        LLM工程師（同理，168 筆）、深度學習工程師（35 筆，產出最低）、
  #        MLOps（52 筆，DE 格 JD 很少提）。AI 類職缺改由 104 公開履歷的 inbound 承接。
  #
  # 2026-09-23 再改:拿掉「系統整合工程師」「流程自動化」。
  #   它們命中的主要是 SI／接案公司(舊資料「電腦系統整合服務業」125 筆,量第二大),
  #   與「聚焦半導體／金融大公司」的目標反向拉扯。空出的名額給資料倉儲與 BI ——
  #   那兩個詞在金融業的 JD 裡出現頻率最高。
  keywords:
    - "資料工程師"
    - "數據工程師"
    - "ETL工程師"
    - "資料平台工程師"
    - "資料倉儲工程師"
    - "BI工程師"
    - "爬蟲工程師"
    - "數據分析師"
    - "資料科學家"
    - "機器學習工程師"

  # 已驗證的地區代碼
  areas:
    - "6001001000"   # 台北市
    - "6001002000"   # 新北市
    - "6001005000"   # 桃園市
    - "6001006000"   # 新竹縣市(注意:縣市合併,不只新竹市)
    - "6001008000"   # 台中市(2026-09-22 補：硬條件是「台中以北」,原本漏了)

  # ⚠️ 級距值,不是上限值!1=1年以下 3=1~3年 5=3~5年 10=5~10年 99=10年以上
  # 要涵蓋「3 年以下」必須同時送 1 和 3。原始需求寫的 jobexp=3 只會拿到 1~3 年。
  jobexp: ["1", "3"]

  # 新鮮度:0=今日 3=三日內 7=七日內 null=不限
  isnew: 3

  mode: "s"

  # ⚠️ 刻意不設 order:order=15 是「符合度」排序不是日期,且 104 改版後數值會漂移。
  #    新鮮度一律靠 isnew + appearDate + DB 去重來保證。

# ── 產業與公司規模的規則層過濾(2026-09-23 新增)────────────────────────
# 跑在粗篩**之前**:不符合的職缺連 LLM 都不會看到,也不會吃掉每次 18 個詳細頁名額。
#
# 為什麼不在 104 的搜尋參數做:搜尋請求數 = 關鍵字 × 頁數,跟有沒有帶產業參數無關,
# 在 104 端過濾省不到任何預算。程式端過濾則是零額外請求、零封鎖風險、可離線測試。
#
# 判斷依據 coIndustry / employeeCount 在**搜尋列表回應裡就有**,不必抓詳細頁
# (1,637 筆真實資料驗證,缺失率 0)。
targeting:
  enabled: true

  # 104 的產業代碼是階層式的,填**前綴**就涵蓋整群。
  # ⚠️ 只能填數字代碼,填中文名稱 config.py 會直接拒絕啟動 ——
  #    因為名稱打錯不會報錯,只會默默把所有職缺濾光。
  # 括號內數字是舊資料(32 天、AI 關鍵字)的筆數,換關鍵字後會變,僅供量級參考。
  industry_prefixes:
    # 半導體核心
    - "1001006"   # 半導體業:半導體製造(63) / IC設計(43) / 其他半導體(25)
    # 電子零組件與光電。半導體上下游大廠多半掛在這兩群
    - "1001005"   # 電子零組件:其他電子零組件(58) / PCB(9) / 被動元件(2)
    - "1001004"   # 光電及光學:光電產業(29) / 光學器材製造(11)
    # 電子大廠(廣達／緯創／華碩這一類)。想「純半導體」的話刪掉這一行即可
    - "1001003"   # 電腦及消費性電子製造:電腦及週邊(86) / 消費性電子(32)
    # 金融
    - "1004"      # 金融投顧及保險:銀行(21) / 證券期貨(17) / 金控(15) / 壽險(10) / 產險(7)

  # 「大公司」的門檻。舊資料下 ≥500 人時半導體/電子 176 筆、金融 53 筆(約 7 筆/天)。
  # 這同時也擋掉了人力仲介代徵(43 筆)與有限公司規模的小案場。
  min_employee_count: 500

scrape:
  # 緊急剎車。設為 false(或環境變數 JOBFINDER_SCRAPE_DISABLED=1)時
  # pipeline 直接短路,連請求都不發。
  enabled: true

  # http   = 直接打 104 的 JSON API(預設)。實測搜尋 API 沒有 Cloudflare,
  #          擋人的只是一條 Referer 白名單規則,單次請求約 1 秒。
  # browser = Patchright 真實瀏覽器備援。只有在 104 把 Referer 檢查換成
  #          真正的 bot detection 時才需要切過去(告警會明確告訴你)。
  mode: "http"

  # 搜尋 API 的門檻就是這個 header。設錯或沒帶一定回 403(body 為空)。
  referer: "https://www.104.com.tw/jobs/search/"

  # 端點做成設定值:104 改版時改這裡重 deploy 即可,不用改程式。
  search_api_pattern: "/jobs/search/api/jobs"
  detail_api_pattern: "/job/ajax/content/"

  # ── 請求預算(硬上限,見 SPEC.md 規則 3)────────────────────────
  # 2026-09-22 D17 重算：關鍵字 7 → 10,但總導覽數硬上限 40 是程式常數不可調。
  #   10 關鍵字 x 2 頁 = 20 次搜尋,+ 18 次詳細頁 = 38,留 2 次餘裕。
  #   維持 3 頁的話 30 + 詳細頁會爆表,最後幾個關鍵字會被預算靜默砍掉。
  #   實測每頁約 26 筆,2 頁/關鍵字 ≈ 52 筆,配 isnew=3 已足夠。
  max_pages_per_keyword: 2      # 【硬上限 3】
  max_details_per_run: 18       # 【硬上限 25】
  max_navigations_per_run: 40   # 【硬上限 40】搜尋頁 + 詳細頁合計的總導覽數

  # ── 節流(硬下限,見 SPEC.md 規則 4)────────────────────────────
  # 全部帶 jitter:固定間隔本身就是機器人指紋。
  page_delay_range: [3.0, 5.0]      # 【下限 3.0】分頁之間
  keyword_delay_range: [5.0, 9.0]   # 【下限 3.0】關鍵字之間
  detail_delay_range: [4.0, 8.0]    # 【下限 3.0】詳細頁之間

  # ── 瀏覽器 ────────────────────────────────────────────────────
  headless: true

  # UA 的正確做法在兩種模式下剛好相反,config.py 會依 mode 強制驗證:
  #   http    → 必填,而且要誠實標示用途與聯絡方式。104 的 API 根本不檢查 UA
  #             (實測 curl/8.x 也照樣 200),偽裝沒好處,誠實反而降低合規風險。
  #   browser → 必須 null。偽造的 UA 與 Chromium 實際指紋不一致,最像機器人。
  user_agent: "JobFinder/0.1 (personal job-seeking daily digest; +az045317@gmail.com)"
  locale: "zh-TW"
  timezone_id: "Asia/Taipei"
  viewport: [1440, 900]
  page_timeout_ms: 45000
  api_wait_seconds: 25          # 等待目標 API 回應被攔截的逾時
  warmup_max_seconds: 30        # 等 Cloudflare 挑戰通過的上限

  # 台灣住宅代理。若 Modal 的資料中心 IP 過不了 Cloudflare,
  # 填這裡即可切換,不需改程式(見 SPEC.md 風險表)。
  # proxy: { server: "http://host:port", username: "...", password: "..." }
  proxy: null

  save_debug_screenshot: true

circuit:
  # 熔斷器(SPEC.md 規則 2)。被擋過就冷卻,避免隔天再跑坐實機器人身分。
  cooldown_hours: 24            # 【硬下限 24】第一次被擋
  escalated_cooldown_hours: 72  # 連續第二次
  # 連續第三次為無限期,須手動 `jobfinder reset-circuit`

dedupe:
  repost_cooldown_days: 30      # 同 job_no 重新上架,至少隔這麼久才會再推
  retain_days: 180              # 超過此天數的紀錄清掉,控制 db 大小

llm:
  base_url: "https://openrouter.ai/api/v1"
  referer: "https://github.com/yiyiscode"
  title: "job-finder"

  # ⚠️ 這兩個 model id 必須先跑 `python scripts/check_models.py` 驗證:
  #    (1) id 確實存在於 OpenRouter (2) supported_parameters 含 structured_outputs
  #    模型汰換很快,不要假設這裡的值永遠有效。
  screen:
    model: "google/gemini-2.5-flash-lite"
    batch_size: 15              # 【硬上限 15】再多會漏回 job_no 且後段被前段錨定
    max_concurrent: 3           # 這是打 OpenRouter 的並行,與抓取並行無關
    temperature: 0.1
    rough_threshold: 45         # 粗篩分數低於此不進深評
  deep:
    model: "google/gemini-2.5-flash"
    max_concurrent: 4
    temperature: 0.2

  fallback_model: "google/gemini-2.5-flash-lite"
  max_retries: 3
  timeout_seconds: 120
  daily_cost_cap_usd: 0.50      # 超過中止 LLM 階段並告警

scoring:
  # 80 是依真實資料校準過的:單一關鍵字的 32 筆裡,70 分就頂到每日上限,
  # 而 70–79 與 80+ 之間有明顯斷層。六組關鍵字一起跑時,70 會天天塞滿 10 則。
  # ⚠️ 2026-09-22 D17：關鍵字整批換掉後,這個門檻的校準已失效,要重新看。
  #    舊資料:deep 528 筆平均 74.3,80 分以上 218 筆(41%)——真正在篩的是
  #    max_per_day 不是 threshold。跑 3-5 次後回來看分布再決定調門檻或改 top_n。
  threshold: 80
  max_per_day: 10
  mode: "threshold"             # threshold | top_n(校準不了時可一行切成相對排序)
  top_n: 5                      # mode=top_n 時生效
  list_rejected_in_summary: true
  max_rejected_listed: 10

  # 給 prompt 用,也給程式重算 total 用。加總必須為 100。
  weights:
    tech_fit: 35
    exp_fit: 25                 # 刻意佔重:對 0-1 年年資者,年資是最關鍵的過濾維度
    domain_fit: 15
    growth_fit: 15
    practical_fit: 10

  # 年資 hard rule(SPEC.md §6.4):能用規則做的事就別問 LLM
  senior_years_cutoff: 5        # JD 要求 >= 幾年算資深
  senior_exp_fit_cap: 8         # 資深職缺的 exp_fit 強制上限

notify:
  provider: "telegram"
  parse_mode: "HTML"            # 不用 MarkdownV2:要跳脫 18 個字元,職缺標題必爆
  min_interval_seconds: 1.2     # 單一聊天室建議 < 1 msg/sec
  disable_link_preview: true
  send_summary_first: true
  send_when_zero_matches: true  # 就算 0 則達標也送摘要,避免靜默讓人以為壞了
  alert_on_failure: true

paths:
  # 2026-09-22 D17：換成主動投遞用履歷(流程自動化/系統整合主敘事)。
  # profile.md 是 104 公開履歷(AI 主敘事),那份負責 inbound,不是這個工具的評分基準。
  resume: "profile-de.md"
  db_filename: "jobs.db"
  profile_tarball: "chrome-profile.tar.gz"
  storage_state: "storage_state.json"

runtime:
  timezone: "Asia/Taipei"
  log_level: "INFO"
